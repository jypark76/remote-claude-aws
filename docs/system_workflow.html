<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System workflow</title>
<style>
  body { margin: 0; padding: 24px; background: #f7f7f5; font-family: -apple-system, sans-serif; }
  .t { font-size: 14px; fill: #1a1a1a; }
  .th { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
  .ts { font-size: 12px; fill: #5a5a5a; }
  .box { fill: #ffffff; stroke: #b0b0b0; }
  .arr { stroke: #767676; stroke-width: 1.5; fill: none; }
  .c-gray rect { fill: #F1EFE8; stroke: #888780; }
  .c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
  .c-gray text, .c-teal text { fill: #2C2C2A; }

<body>
<svg width="100%" viewBox="0 0 930 900" style="max-width:930px;display:block;margin:0 auto" role="img">
<title>remote_claude infrastructure: request path from browser to every managed AWS service it touches</title>
<desc>A browser's HTTPS request goes to CloudFront's global edge network, then to an Application Load Balancer using sticky sessions, then to one of two EC2 instances in an auto-scaling group spread across two availability zones (min 1, max 3, currently 2 running), each running Flask and spawning Claude Code per chat. From there, the instances reach four managed services directly: Cognito verifies logins, Amazon Bedrock is where the model is meant to live (currently the direct Claude API instead, while an AWS account/billing restriction on Bedrock invoke access is unresolved), EFS holds chat state shared between both instances so a request can land on either one, and Postgres on RDS runs Multi-AZ with a standby. Security groups lock this down hop by hop - CloudFront can only reach the load balancer, the load balancer can only reach the instances, and the instances can only reach the database and EFS, nothing is reachable directly from outside its intended predecessor. Everything still lives in one AWS region - there is no multi-region failover yet.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray">
  <rect x="315" y="40" width="220" height="60" rx="6" class="box"/>
  <text x="425" y="64" text-anchor="middle" class="th">Browser</text>
  <text x="425" y="83" text-anchor="middle" class="ts">React chat UI</text>
</g>
<line x1="425" y1="100" x2="425" y2="140" class="arr" marker-end="url(#arrow)"/>
<text x="580" y="123" text-anchor="middle" class="ts">HTTPS request</text>

<g class="c-gray">
  <rect x="315" y="140" width="220" height="60" rx="6" class="box"/>
  <text x="425" y="164" text-anchor="middle" class="th">CloudFront</text>
  <text x="425" y="183" text-anchor="middle" class="ts">global edge network</text>
</g>
<line x1="425" y1="200" x2="425" y2="240" class="arr" marker-end="url(#arrow)"/>
<text x="570" y="223" text-anchor="middle" class="ts">sticky session</text>

<g class="c-gray">
  <rect x="315" y="240" width="220" height="60" rx="6" class="box"/>
  <text x="425" y="264" text-anchor="middle" class="th">Load Balancer</text>
  <text x="425" y="283" text-anchor="middle" class="ts">ALB &#8212; sticky sessions</text>
</g>

<rect x="190" y="330" width="620" height="120" rx="8" fill="none" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="4 3"/>
<text x="206" y="348" class="ts">Auto-scaling group &#8212; 2 AZs (min 1, max 3, currently 2 running)</text>

<line x1="425" y1="300" x2="290" y2="365" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="300" x2="560" y2="365" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="220" y="365" width="220" height="66" rx="6" class="box"/>
  <text x="330" y="391" text-anchor="middle" class="th">EC2 (AZ-1)</text>
  <text x="330" y="410" text-anchor="middle" class="ts">Flask + Claude Code</text>
</g>

<g class="c-gray">
  <rect x="490" y="365" width="220" height="66" rx="6" class="box"/>
  <text x="600" y="391" text-anchor="middle" class="th">EC2 (AZ-2)</text>
  <text x="600" y="410" text-anchor="middle" class="ts">Flask + Claude Code</text>
</g>

<path d="M330 431 L330 470 L145 470 L145 505" class="arr" marker-end="url(#arrow)"/>
<path d="M330 431 L330 470 L360 470 L360 505" class="arr" marker-end="url(#arrow)"/>
<path d="M600 431 L600 470 L580 470 L580 505" class="arr" marker-end="url(#arrow)"/>
<path d="M600 431 L600 470 L790 470 L790 505" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="40" y="505" width="210" height="66" rx="6" class="box"/>
  <text x="145" y="531" text-anchor="middle" class="th">Cognito</text>
  <text x="145" y="550" text-anchor="middle" class="ts">verifies login</text>
</g>

<g class="c-teal">
  <rect x="255" y="505" width="210" height="66" rx="6" class="box"/>
  <text x="360" y="531" text-anchor="middle" class="th">Amazon Bedrock</text>
  <text x="360" y="550" text-anchor="middle" class="ts">AI model lives here</text>
</g>
<text x="360" y="592" text-anchor="middle" class="note">
  <tspan x="360" dy="0">* intended design &#8212; currently on the</tspan>
  <tspan x="360" dy="14">direct Claude API instead, while an</tspan>
  <tspan x="360" dy="14">AWS account/billing issue with Bedrock</tspan>
  <tspan x="360" dy="14">gets sorted out</tspan>
</text>

<g class="c-teal">
  <rect x="475" y="505" width="210" height="66" rx="6" class="box"/>
  <text x="580" y="531" text-anchor="middle" class="th">EFS</text>
  <text x="580" y="550" text-anchor="middle" class="ts">shared chat state</text>
</g>

<g class="c-teal">
  <rect x="690" y="505" width="210" height="66" rx="6" class="box"/>
  <text x="795" y="531" text-anchor="middle" class="th">Postgres (RDS)</text>
  <text x="795" y="550" text-anchor="middle" class="ts">Multi-AZ + standby</text>
</g>

<text x="465" y="680" text-anchor="middle" class="ts">Hop-by-hop lockdown: CloudFront &#8594; LB only &#183; LB &#8594; instances only &#183; instances &#8594; DB / EFS only</text>
<text x="465" y="704" text-anchor="middle" class="note">Still one AWS region &#8212; no multi-region failover yet</text>
<text x="465" y="736" text-anchor="middle" class="ts">gray = compute layer (LB, EC2) &#183; teal = managed AWS services</text>
</svg>
</body>
</html>
