<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System workflow</title>
<style>
  body { margin: 0; padding: 24px; background: #f7f7f5; font-family: -apple-system, sans-serif; }
  .t { font-size: 14px; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
  .ts { font-size: 12px; fill: #5a5a5a; }
  .box { fill: #ffffff; stroke: #b0b0b0; }
  .arr { stroke: #767676; stroke-width: 1.5; fill: none; }
  .c-gray rect { fill: #F1EFE8; stroke: #888780; }
  .c-purple rect { fill: #EEEDFE; stroke: #7F77DD; }
  .c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
  .c-coral rect { fill: #FAECE7; stroke: #D85A30; }
  .c-gray text, .c-purple text, .c-teal text, .c-coral text { fill: #2C2C2A; }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 634" style="max-width:680px;display:block;margin:0 auto" role="img">
<title>remote_claude full request workflow</title>
<desc>A browser sends an HTTPS request to CloudFront, which proxies it to a Flask server on EC2. Flask spawns a Claude Code process for that chat. Flask and Claude Code both run on the same EC2 machine, shown as a dashed box, with no built-in intelligence. That process then does three things: it asks Amazon Bedrock, where the actual AI model lives, what to do next; it reads and writes files in its own chat folder on the EC2 disk; and it runs SQL commands against a shared Postgres database for grading data. The local chat folder is separately backed up to S3 a few seconds after each save, so it survives even if the EC2 machine is ever destroyed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray">
  <rect x="240" y="40" width="200" height="56" rx="4" class="box"/>
  <text x="340" y="58" text-anchor="middle" class="th">Browser</text>
  <text x="340" y="76" text-anchor="middle" class="ts">React chat UI</text>
</g>

<line x1="340" y1="96" x2="340" y2="136" class="arr" marker-end="url(#arrow)"/>
<text x="450" y="120" class="ts">HTTPS request</text>

<g class="c-gray">
  <rect x="240" y="136" width="200" height="56" rx="4" class="box"/>
  <text x="340" y="154" text-anchor="middle" class="th">CloudFront</text>
  <text x="340" y="172" text-anchor="middle" class="ts">TLS termination</text>
</g>

<line x1="340" y1="192" x2="340" y2="236" class="arr" marker-end="url(#arrow)"/>
<text x="450" y="218" class="ts">proxies to port 5000</text>

<rect x="180" y="212" width="320" height="210" rx="8" fill="none" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="4 3"/>
<text x="196" y="228" class="ts">EC2 server — one machine</text>

<g class="c-gray">
  <rect x="240" y="242" width="200" height="56" rx="4" class="box"/>
  <text x="340" y="260" text-anchor="middle" class="th">Flask</text>
  <text x="340" y="278" text-anchor="middle" class="ts">receives the request</text>
</g>

<line x1="340" y1="298" x2="340" y2="338" class="arr" marker-end="url(#arrow)"/>
<text x="450" y="322" class="ts">spawns per chat</text>

<g class="c-purple">
  <rect x="240" y="338" width="200" height="56" rx="4" class="box"/>
  <text x="340" y="356" text-anchor="middle" class="th">Claude Code</text>
  <text x="340" y="374" text-anchor="middle" class="ts">no AI of its own</text>
</g>

<path d="M270 394 L270 414 L140 414 L140 434" class="arr" marker-end="url(#arrow)"/>
<text x="205" y="406" text-anchor="middle" class="ts">asks a question</text>

<line x1="340" y1="394" x2="340" y2="434" class="arr" marker-end="url(#arrow)"/>
<text x="355" y="418" class="ts">reads / writes</text>

<path d="M410 394 L410 414 L540 414 L540 434" class="arr" marker-end="url(#arrow)"/>
<text x="475" y="406" text-anchor="middle" class="ts">runs SQL via psql</text>

<g class="c-teal">
  <rect x="50" y="434" width="180" height="56" rx="4" class="box"/>
  <text x="140" y="452" text-anchor="middle" class="th">Amazon Bedrock</text>
  <text x="140" y="470" text-anchor="middle" class="ts">AI model lives here</text>
</g>
<text x="140" y="504" text-anchor="middle" class="ts" fill="#D85A30">
  <tspan x="140" dy="0">* intended design — currently on the</tspan>
  <tspan x="140" dy="14">direct Claude API instead, while an</tspan>
  <tspan x="140" dy="14">AWS account/billing issue with Bedrock</tspan>
  <tspan x="140" dy="14">gets sorted out</tspan>
</text>

<g class="c-gray">
  <rect x="250" y="434" width="180" height="56" rx="4" class="box"/>
  <text x="340" y="452" text-anchor="middle" class="th">Local chat folder</text>
  <text x="340" y="470" text-anchor="middle" class="ts">on the EC2 disk</text>
</g>

<g class="c-teal">
  <rect x="450" y="434" width="180" height="56" rx="4" class="box"/>
  <text x="540" y="452" text-anchor="middle" class="th">Postgres (RDS)</text>
  <text x="540" y="470" text-anchor="middle" class="ts">shared assignment data</text>
</g>

<line x1="340" y1="490" x2="340" y2="538" class="arr" marker-end="url(#arrow)"/>
<text x="355" y="512" class="ts">aws s3 sync, 5s after save</text>

<g class="c-coral">
  <rect x="250" y="538" width="180" height="56" rx="4" class="box"/>
  <text x="340" y="556" text-anchor="middle" class="th">S3 backup</text>
  <text x="340" y="574" text-anchor="middle" class="ts">survives EC2 loss</text>
</g>

<text x="340" y="610" text-anchor="middle" class="ts">gray = one EC2 machine · purple = the agent · teal/coral = separate services it calls</text>
</svg>
</body>
</html>
