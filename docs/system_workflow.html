<title>remote_claude full request workflow, with the OWASP guardrail layer and eval harness</title>
<desc>A browser sends an HTTP request straight to the EC2 box's own address - no CDN in front of it, CloudFront was planned but never actually deployed. Gunicorn (running eventlet workers, so the live websocket connection works) receives it and spawns a Claude Code process for that chat, restricted to four tools (Bash, Read, Write, Edit) and a one-dollar-per-message spend cap, with no other environment variables than its own Anthropic API key. That process asks Amazon Bedrock (or, currently, the direct Claude API while a Bedrock account restriction is unresolved) what to do next, reads and writes files in its own chat folder, whose CLAUDE.md instructions are regenerated fresh from code on every save so the agent can never permanently rewrite its own rules, reaches Postgres only through a root-owned wrapper script invoked via a narrow sudo rule so it never sees the real database credentials, only query results, from a Postgres role that itself cannot delete or truncate anything, and turns text into a similarity-search fingerprint through a small local embedding model, with no database access of its own. Everything the process says passes through an output filter that strips secret values and model-identity strings before it reaches the browser or gets saved. A guest login can view any chat but is blocked, server-side, from ever reaching the Claude Code step at all. Separately, an eval harness outside the running system exercises the live app the same way a real user or attacker would: real chat messages, a real malicious upload, and direct inspection of the EC2 process and the database, checking that every one of these guardrails still holds.</desc>
